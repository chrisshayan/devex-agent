filebeat.inputs:
  # DevEx Agent application logs
  - type: log
    enabled: true
    paths:
      - /app/logs/*.log
      - /app/logs/**/*.log
    fields:
      service: devex-agent
      environment: production
      log_type: application
    fields_under_root: true
    multiline.pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
    multiline.negate: true
    multiline.match: after

  # Docker container logs
  - type: docker
    enabled: true
    containers.ids:
      - "*"
    containers.path: "/var/lib/docker/containers"
    containers.stream: "all"
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true

  # Nginx access logs
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/access.log
    fields:
      service: nginx
      log_type: access
    fields_under_root: true

  # Nginx error logs
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/error.log
    fields:
      service: nginx
      log_type: error
    fields_under_root: true

# Processors to enrich logs
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~

# Output to Elasticsearch
output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "devex-agent-logs-%{+yyyy.MM.dd}"
  template.name: "devex-agent"
  template.pattern: "devex-agent-*"
  template.settings:
    index.number_of_shards: 1
    index.number_of_replicas: 0

# Logging configuration
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644

# Enable monitoring
monitoring.enabled: true
monitoring.elasticsearch:
  hosts: ["elasticsearch:9200"]

# Setup templates and dashboards
setup.template.enabled: true
setup.template.settings:
  index.number_of_shards: 1
  index.codec: best_compression

setup.dashboards.enabled: true
setup.kibana:
  host: "kibana:5601" 