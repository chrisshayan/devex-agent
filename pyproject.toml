[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devex-agent"
version = "0.1.0"
description = "Ambient DevEx Assistant for enhanced developer experience"
authors = [{name = "DevEx Team"}]
dependencies = [
    "fastapi[all]>=0.104.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "chromadb>=0.4.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "uvicorn[standard]>=0.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0"
]
